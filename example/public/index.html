<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WsRouter • WebRTC & Real-time Showcase</title>
  <meta name="description" content="Unified WsRouter example showcase featuring WebRTC live webcam streaming, online presence tracking, JWT authentication, and REST routing.">
  
  <!-- BeerCSS CDN & Material Symbols -->
  <link href="https://cdn.jsdelivr.net/npm/beercss@3.9.4/dist/cdn/beer.min.css" rel="stylesheet">
  <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@3.9.4/dist/cdn/beer.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    :root {
      --primary: #2563eb;
      --primary-container: #1d4ed8;
      --surface: #1e293b;
      --background: #0f172a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: #0f172a;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-root-container {
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* Video Player Stage */
    .video-stage {
      position: relative;
      width: 100%;
      background: #020617;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #1e293b;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .stage-video-element {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .stage-video-element.hidden {
      display: none;
    }

    .stage-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
      z-index: 2;
    }

    .video-overlay-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 0.82rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .video-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      background: linear-gradient(to top, rgba(2, 6, 23, 0.9) 0%, transparent 100%);
    }

    /* Live Dot Indicator */
    .live-dot-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .live-dot-indicator.live {
      background-color: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      animation: pulse-dot 1.5s infinite;
    }

    .live-dot-indicator.offline {
      background-color: #64748b;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Floating Reactions */
    .floating-reactions-layer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 20;
    }

    .floating-emoji-item {
      position: absolute;
      bottom: 20px;
      font-size: 2.2rem;
      animation: float-up-fade ease-out forwards;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
    }

    @keyframes float-up-fade {
      0% {
        transform: translateY(0) scale(0.6);
        opacity: 0;
      }
      15% {
        transform: translateY(-20px) scale(1.3);
        opacity: 1;
      }
      80% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(-260px) scale(1);
        opacity: 0;
      }
    }

    .reaction-bar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .reaction-btn {
      font-size: 1.25rem !important;
      transition: transform 0.15s ease;
    }

    .reaction-btn:hover {
      transform: scale(1.3);
    }

    .reaction-btn:active {
      transform: scale(0.9);
    }

    .header-logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    .pages-wrapper .page.hidden {
      display: none !important;
    }

    .pages-wrapper .page.active {
      display: block !important;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      .hide-on-mobile {
        display: none !important;
      }
      .show-on-mobile {
        display: flex !important;
      }
    }

    @media (min-width: 601px) {
      .show-on-mobile {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Preact & Application Entry -->
  <script type="module">
    import { h, render } from 'https://esm.sh/preact';
    import { App } from './components/App.js';

    render(h(App, null), document.getElementById('app'));
  </script>
</body>
</html>
