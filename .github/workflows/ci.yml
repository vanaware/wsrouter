name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    name: Type Check & Test (Deno ${{ matrix.denoVersion }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        denoVersion:
          - "v2.x"
          - "canary"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.denoVersion }}

      - name: Check code types
        run: deno task check

      - name: Run tests
        run: deno task test

  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"

      - name: Lint code
        run: deno task lint

      - name: Check formatting
        run: deno task fmt-check
